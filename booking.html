<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Book Your Stay</title>
</head>
<body class="bg-black text-white p-10">
    <h2 class="text-4xl text-[#d4af37] font-serif mb-10 text-center">Reserve Your Villa</h2>
    <form id="bookingForm" class="max-w-xl mx-auto grid gap-4">
        <input type="text" id="name" placeholder="Name" class="p-3 bg-neutral-900 border border-[#d4af37]" required>
        <input type="date" id="checkin" class="p-3 bg-neutral-900 border border-[#d4af37]" required>
        <button type="submit" class="bg-[#d4af37] p-3 text-black font-bold uppercase">Confirm Booking</button>
    </form>
    <div id="bookingResult" class="text-center mt-10 text-[#d4af37] text-xl"></div>
    <script src="script.js"></script>
</body>
</html>
